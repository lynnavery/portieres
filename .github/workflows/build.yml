name: build
on: [push, pull_request, workflow_dispatch]

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh source/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: portieres-macos
          path: externals/portieres~.mxo

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S source -B build -G "Visual Studio 17 2022" -A x64 -T ClangCL
      - run: cmake --build build --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: portieres-windows
          path: externals/portieres~.mxe64
