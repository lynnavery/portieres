name: build
on: [push, pull_request, workflow_dispatch]

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh source/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: portieres-macos
          path: externals/portieres~.mxo

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - run: cmake -S source -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang-cl
      - run: cmake --build build
      - uses: actions/upload-artifact@v4
        with:
          name: portieres-windows
          path: externals/portieres~.mxe64
