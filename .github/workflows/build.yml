name: build
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh source/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: portieres-macos
          path: externals/portieres~.mxo

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - run: cmake -S source -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang-cl
      - run: cmake --build build
      - uses: actions/upload-artifact@v4
        with:
          name: portieres-windows
          path: externals/portieres~.mxe64

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: portieres-macos
          path: pkg/portieres/externals/portieres~.mxo
      - uses: actions/download-artifact@v4
        with:
          name: portieres-windows
          path: pkg/portieres/externals
      - name: Assemble package
        run: |
          cp -r help package-info.json README.md LICENSE-beads.txt LICENSE-stmlib pkg/portieres/
          chmod +x "pkg/portieres/externals/portieres~.mxo/Contents/MacOS/portieres"
          cd pkg && zip -r -y "../portieres-${GITHUB_REF_NAME}.zip" portieres
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "portieres-${GITHUB_REF_NAME}.zip" --generate-notes --title "$GITHUB_REF_NAME"
